<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

<script>
  window.web = "PRoman Blog";

  // Normalizar tildes y obtener iniciales (I, T, E)
  var cleanWeb = web.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  var initials = cleanWeb.match(/\b\w/g)?.join("").slice(0, 3).toUpperCase() || "PR";

  generateFavicon(initials);
  document.title = web;

  function generateFavicon(initials) {
    var canvas = document.createElement('canvas');
    var context = canvas.getContext('2d');

    // Proporciones para que quepa el diseño vertical
    canvas.width = 64;
    canvas.height = 64;

    // --- FONDO AZUL ---
    context.fillStyle = "#4285F4"; // Azul estilo Google
    // Si prefieres el azul anterior, usa: #79aded
    context.fillRect(0, 0, canvas.width, canvas.height);

    // --- LETRAS BLANCAS ---
    const textColor = "white";

    // Posiciones de las letras para el efecto de superposición
    const positions = [
      canvas.width * 0.25, // Inicial 1
      canvas.width * 0.50, // Inicial 2
      canvas.width * 0.75  // Inicial 3
    ];

    const fontStyle = "bold 44px sans-serif";

    // 1️⃣ Letra izquierda
    context.save();
    context.translate(positions[0], canvas.height / 2);
    context.scale(1, 1.3);
    context.font = fontStyle;
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.fillStyle = textColor;
    context.fillText(initials[0] || "", 0, 0);
    context.restore();

    // 2️⃣ Letra derecha
    context.save();
    context.translate(positions[2], canvas.height / 2);
    context.scale(1, 1.3);
    context.font = fontStyle;
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.fillStyle = textColor;
    context.fillText(initials[2] || "", 0, 0);
    context.restore();

    // 3️⃣ Letra central (encima)
    context.save();
    context.translate(positions[1], canvas.height / 2);
    context.scale(1, 1.3);
    context.font = fontStyle;
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.fillStyle = textColor;
    context.fillText(initials[1] || "", 0, 0);
    context.restore();

    // Actualizar el enlace del favicon
    var link = document.createElement('link');
    link.rel = 'icon';
    link.href = canvas.toDataURL('image/png');

    document.querySelectorAll("link[rel='icon']").forEach(e => e.remove());
    document.head.appendChild(link);
  }
</script>

</body>

</html>
